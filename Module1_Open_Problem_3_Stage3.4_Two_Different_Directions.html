/* The animated scene: the SVG with its parts shown in turn, and a caption band like the Open Problem 2 animation. */
.scene { position: relative; margin: 0; border-radius: 14px; overflow: hidden; border: 1px solid var(--border); background: #eaf4f6; }
.scene > svg { width: 100%; height: auto; }
.sound svg { flex: none; width: 19px; height: 19px; }
.scene #bubble-left, .scene #bubble-right, .scene #bubble-ananya { opacity: 0; transform: scale(.6); transform-box: fill-box; transform-origin: center bottom; transition: opacity .35s ease, transform .35s cubic-bezier(.3,1.5,.6,1); }

.scene #arm-owner { transform-origin: right center; }
.scene #arm-driver { transform-origin: center bottom; }
.scene.point-left #arm-owner { animation: wag 0.5s ease-in-out 3; }

.dot-rec { width: 12px; height: 12px; border-radius: 50%; background: #d13b3b; display: inline-block; }

.btn-small { min-height: 44px; padding: 0 16px; font-size: 0.97rem; }
@media (max-width: 899px) {

  .action button { flex: 1; min-width: 0; }
}
.foot { max-width: 1240px; margin: 0 auto; padding: 0 32px 24px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 16px; font-size: 0.85rem; color: var(--muted); }

.center { text-align: center; }
.end p { font-size: 1.1rem; }

  <title id="forkTitle">Two different directions at a fork in the road</title>
  <desc id="forkDesc">Late morning on the road outside the campus. The road splits in two. On the left, the tea-stall owner in a green apron points to the left road. On the right, an auto-rickshaw driver in a khaki uniform points straight on. Ananya, seen from behind in her teal kurta with her sling bag, stands at the fork with an empty speech bubble above her.</desc>
