<style>
:root {
  --page: #fbfbfe; --card: #ffffff; --heading: #0e1a4f; --body: #4c5682; --muted: #5a6389; --border: #e4e8f5;
  --primary: #3c59f6; --primary-hover: #2f4ae0; --select-bg: rgba(60,89,246,.08); --blue-tonal-border: rgba(60,89,246,.35);

  --success: #1c7f59; --success-bg: rgba(79,224,168,.16); --success-border: rgba(28,154,107,.4);
  --warn-bg: #fff8e6; --warn-border: #f3c96b; --warn-text: #6b4300; --overlay: rgba(14,26,79,.35);
  --info-bg: #eef2ff; --info-border: rgba(60,89,246,.3); --info-text: #23358f;

* { box-sizing: border-box; }
html, body { margin: 0; }
/* Same text sizes as the other Module 1 pages: 16 px root on phones and small laptops, up to 19 px on large monitors. */

.clock { display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border-radius: 999px; background: var(--teal-bg); color: var(--teal); font-size: 0.94rem; font-weight: 600; }
.btn-ghost { display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--border); background: #fff; color: var(--heading); font-size: 0.94rem; font-weight: 600; cursor: pointer; }

.layout { max-width: 1240px; margin: 0 auto; padding: 4px 16px 100px; }
@media (min-width: 900px) { .layout { padding: 4px 32px 24px; } }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 18px; }
@media (min-width: 640px) { .card { padding: 24px 30px 26px; } }
/* Desktop: the scene on the left and the task on the right; phones stack, question close to the top. */
.cols { display: grid; gap: 22px; grid-template-columns: 1fr; }
.cols > * { min-width: 0; }
@media (min-width: 1000px) { .cols { grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 34px; } }
@media (max-width: 999px) { .scene-col.later { display: none; } }

.eyebrow::before { content: ""; width: 18px; height: 1px; background: var(--amber); }

.hero { margin: 0 0 12px; color: var(--heading); font-size: 1.6rem; line-height: 1.15; font-weight: 600; }
@media (min-width: 640px) { .hero { font-size: 2rem; } }
@media (max-width: 640px) { .hero { display: none; } }
/* The animated scene: the SVG with its parts shown in turn, and a caption band like the Open Problem 2 animation. */
.scene { position: relative; margin: 0; border-radius: 14px; overflow: hidden; border: 1px solid var(--border); background: #eaf4f6; }
.scene > svg { width: 100%; height: auto; }
.sound svg { flex: none; width: 19px; height: 19px; }

.scene .stack { position: relative; aspect-ratio: 5 / 4; overflow: hidden; background: #e9eef0; }
.scene .stack img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 30%; opacity: 0; transition: opacity .7s ease; }
.scene[data-scene="1"] .stack img.s1, .scene[data-scene="2"] .stack img.s2, .scene[data-scene="3"] .stack img.s3 { opacity: 1; animation: drift 9s ease-out forwards; }
@keyframes drift { from { transform: scale(1); } to { transform: scale(1.04); } }
.scene .band { display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 10px 16px; background: #f8f4e7; border-top: 1px solid var(--border); }
.scene .num { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 38px; border-radius: 50%; background: #2f3d36; color: #fff; font-weight: 700; font-size: 1.05rem; }
.scene .num.turn { background: var(--amber); color: var(--amber-on); }
.scene .cap { color: #1f2a24; font-weight: 700; font-size: 1.12rem; line-height: 1.3; min-height: 1.3em; }

  .scene .stack img { transition: none; animation: none !important; }
}
.sound { position: absolute; top: 10px; right: 10px; z-index: 2; display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 14px 0 10px; border-radius: 999px; border: 0; background: rgba(14,26,79,.82); color: #fff; font-size: 0.94rem; font-weight: 600; cursor: pointer; }
.sound[hidden] { display: none; }

@media (max-width: 520px) { .sound.in-band { padding: 0 9px; } .sound.in-band .lbl { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; } }

.stepline { display: flex; align-items: center; gap: 12px; }

.count { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; margin-top: 6px; font-size: 0.9rem; color: var(--muted); font-variant-numeric: tabular-nums; }

.label { margin: 18px 0 0; color: var(--heading); font-weight: 700; font-size: 1.03rem; }

.invalid:empty { display: none; }
.fb { margin-top: 10px; padding: 12px 14px; border-radius: 12px; font-size: 1.03rem; }
.fb.good { background: var(--success-bg); border: 1px solid var(--success-border); color: #0f4f37; }
.fb.part { background: var(--warn-bg); border: 1px solid var(--warn-border); color: var(--warn-text); }
.fb .head { display: flex; gap: 8px; align-items: center; font-weight: 700; }

.rec .rt { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.rec h2 { margin: 0; color: var(--heading); font-size: 1.06rem; }
.rec p { margin: 6px 0 0; font-size: 0.95rem; }
.rec .row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 10px; }
.rec .elapsed { font-variant-numeric: tabular-nums; color: var(--heading); font-weight: 700; }
.rec audio { width: 100%; max-width: 360px; }
.rec label.consent { display: flex; gap: 8px; align-items: flex-start; margin-top: 8px; font-size: 0.95rem; color: var(--heading); }
.rec input[type=checkbox] { width: 20px; height: 20px; margin-top: 2px; }
.status { min-height: 1.4em; margin: 10px 0 0; font-size: 0.95rem; color: var(--warn-text); }
.dot-rec { width: 12px; height: 12px; border-radius: 50%; background: #d13b3b; display: inline-block; }
.recording .dot-rec { animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .3; } }
.shake { animation: shake .35s ease-in-out; }
@keyframes shake { 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }

.action { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 10px; margin-top: 20px; }
.btn-amber { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-width: 11rem; min-height: 50px; padding: 0 26px; border: 0; border-radius: 999px; background: linear-gradient(135deg, var(--amber-2), var(--amber)); color: var(--amber-on); font-size: 1.125rem; font-weight: 700; box-shadow: 0 6px 18px rgba(243,171,49,.3); cursor: pointer; }
.btn-amber:disabled { background: #fbe3b9; color: #9a8466; box-shadow: none; cursor: not-allowed; }
.btn-blue { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 50px; padding: 0 20px; border: 1px solid var(--blue-tonal-border); border-radius: 999px; background: var(--select-bg); color: var(--primary-hover); font-size: 1.03rem; font-weight: 600; cursor: pointer; }
.btn-blue:disabled { opacity: .5; cursor: not-allowed; }
.btn-small { min-height: 44px; padding: 0 16px; font-size: 0.97rem; }
@media (max-width: 899px) {
  .action { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; margin: 0; padding: 8px 16px calc(8px + env(safe-area-inset-bottom)); background: var(--page); border-top: 1px solid var(--border); }
  .action button { flex: 1; min-width: 0; }
}
.foot { max-width: 1240px; margin: 0 auto; padding: 0 32px 24px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 16px; font-size: 0.85rem; color: var(--muted); }
@media (max-width: 899px) { .foot { padding: 0 16px 90px; } }
.center { text-align: center; }
.end p { font-size: 1.1rem; }
.end .action { justify-content: center; }
.modal-bg { position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center; padding: 16px; background: var(--overlay); }
.modal { width: 100%; max-width: 420px; background: #fff; border-radius: 18px; padding: 22px; text-align: center; }
.modal h2 { color: var(--heading); margin: 0 0 6px; font-size: 1.375rem; }
.modal p { margin: 0 0 16px; font-size: 1.03rem; }
.modal .row { display: grid; gap: 8px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
